<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#0b0b0b"></rect>
  <rect x="40" y="40" width="1120" height="620" rx="16" fill="#101010" stroke="#2a2a2a"></rect>
  <!-- header -->
  <rect x="60" y="70" width="1080" height="40" rx="8" fill="#151515"></rect>
  <!-- filas -->
  <g fill="#191919" stroke="#2b2b2b">
    <rect x="60" y="130" width="1080" height="60" rx="8"></rect>
    <rect x="60" y="200" width="1080" height="60" rx="8"></rect>
    <rect x="60" y="270" width="1080" height="60" rx="8"></rect>
    <rect x="60" y="340" width="1080" height="60" rx="8"></rect>
    <rect x="60" y="410" width="1080" height="60" rx="8"></rect>
    <rect x="60" y="480" width="1080" height="60" rx="8"></rect>
  </g>
  <!-- celdas verticales -->
  <g stroke="#2b2b2b">
    <line x1="300" y1="130" x2="300" y2="540"></line>
    <line x1="540" y1="130" x2="540" y2="540"></line>
    <line x1="780" y1="130" x2="780" y2="540"></line>
  </g>
  <!-- highlights -->
  <rect x="300" y="200" width="240" height="60" rx="8" fill="#1f2937"></rect>
  <rect x="780" y="340" width="240" height="60" rx="8" fill="#1f2937"></rect>
</svg>
